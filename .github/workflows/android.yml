name: Android CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_RELEASE_MINIFYENABLED: 'true'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Get current time
        id: current-time
        run: echo "formattedTime=$(TZ='Asia/Shanghai' date '+%Y%m%d-%H')" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      # 签名密钥缓存：fork 没有 SIGNING_STORE_BASE64 密钥时，keytool 每次会生成
      # 一把全新的随机 keystore，导致新旧 APK 签名不一致、覆盖安装被系统拒绝
      # （表现为"模块是新的但点击设置入口没反应"）。用 cache 把它固定下来。
      - name: Restore fork signing keystore
        uses: actions/cache@v6
        with:
          path: app/keystore.jks
          key: fork-signing-keystore-v1-${{ github.repository }}
      - name: Prepare release signing
        env:
          SECRET_STORE: ${{ secrets.SIGNING_STORE_BASE64 }}
          SECRET_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SECRET_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SECRET_STORE:-}" ]; then
            printf '%s' "$SECRET_STORE" | base64 --decode > app/keystore.jks
            ALIAS="$SECRET_ALIAS"
            KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            STORE_PASSWORD="$SECRET_STORE_PASSWORD"
            echo "::notice title=Signing::Using the release keystore from repository secrets."
          elif [ -s app/keystore.jks ]; then
            ALIAS="fingerprintpay"
            KEY_PASSWORD="fingerprintpay"
            STORE_PASSWORD="fingerprintpay"
            echo "::notice title=Signing::Reusing the cached fork keystore, so this APK can upgrade the previous fork build in place."
          else
            ALIAS="fingerprintpay"
            KEY_PASSWORD="fingerprintpay"
            STORE_PASSWORD="fingerprintpay"
            keytool -genkeypair -v -keystore app/keystore.jks -storetype JKS \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=FingerprintPay Fork, OU=CI, O=Self-Signed, L=NA, ST=NA, C=CN"
            echo "::notice title=Signing::No keystore secret and no cache, generated a fresh one. If you previously installed another fork build, uninstall it first."
          fi
          chmod 600 app/keystore.jks
          {
            echo "SIGNING_KEY_ALIAS=$ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: |
          SDK_PLATFORM=$(sed -n 's/^compileSdk=//p' gradle/android-toolchain.properties)
          SDK_MINOR=$(sed -n 's/^compileSdkMinor=//p' gradle/android-toolchain.properties)
          BUILD_TOOLS=$(sed -n 's/^buildToolsVersion=//p' gradle/android-toolchain.properties)
          NDK_VERSION=$(sed -n 's/^ndkVersion=//p' gradle/android-toolchain.properties)
          sdkmanager "platforms;android-36" "platforms;android-$SDK_PLATFORM.$SDK_MINOR" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" "cmake;3.22.1"
      - uses: actions/cache@v6
        with:
          path: module/build/sodium
          key: sodium-${{ runner.os }}-${{ hashFiles('gradle/android-toolchain.properties', 'module/build-sodium.sh', 'module/vendor/libsodium-1.0.20.tar.gz') }}
      - name: Build Zygisk five-app module
        run: cd ./module && bash ./make.sh
      - name: Verify release artifacts
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, pathlib, re, subprocess, zipfile
          root = pathlib.Path('.')
          metadata = json.loads((root / 'app/build/outputs/apk/release/output-metadata.json').read_text())['elements'][0]
          apk = root / 'app/build/outputs/apk/release' / metadata['outputFile']
          toolchain = dict(line.split('=', 1) for line in (root / 'gradle/android-toolchain.properties').read_text().splitlines() if '=' in line)
          signer = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / toolchain['buildToolsVersion'] / 'apksigner'
          subprocess.run([str(signer), 'verify', str(apk)], check=True)
          module = root / 'module/build/release' / ('zygisk-module-xfingerprint-pay-all-v' + metadata['versionName'] + '-release.zip')
          dist = root / 'module/webui/dist'
          manifest = json.loads((dist / 'manifest.json').read_text())
          with zipfile.ZipFile(apk) as app, zipfile.ZipFile(module) as archive:
              for name in [*manifest['files'], 'manifest.json']:
                  assert app.read('assets/' + name) == archive.read('webroot/' + name) == (dist / name).read_bytes(), name
              for abi in ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']:
                  assert archive.read('lib/' + abi + '/libzygisk-module-xfingerprint-pay-all.so')
                  assert archive.read('bin/' + abi + '/fpconfig')
              assert 'debug-file-dex' not in archive.namelist()
          mapping = (root / 'app/build/outputs/mapping/release/mapping.txt').read_text()
          assert 'com.surcumference.fingerprint.storage.XposedActivation -> com.surcumference.fingerprint.storage.XposedActivation:' in mapping
          assert re.search(r'\bframeworkVersion\(\)(?::[0-9:]+)? -> frameworkVersion$', mapping, re.MULTILINE)
          artifacts = [apk, module]
          (root / 'SHA256SUMS').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in artifacts))
          print('Verified signed release inputs, four ABIs, R8 and matching WebUI assets')
          PYVERIFY
      - name: Upload Apk
        uses: actions/upload-artifact@v7
        with:
          name: xposed.${{ steps.current-time.outputs.formattedTime }}
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk
      - name: Upload Mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping.${{ steps.current-time.outputs.formattedTime }}
          if-no-files-found: error
          path: app/build/outputs/mapping/release/mapping.txt
      - name: Upload WebUI dist
        uses: actions/upload-artifact@v7
        with:
          name: webui.${{ steps.current-time.outputs.formattedTime }}
          path: module/webui/dist/
      - name: Upload native modules
        uses: actions/upload-artifact@v7
        with:
          name: magisk.${{ steps.current-time.outputs.formattedTime }}
          path: |
            module/build/release/zygisk-module-xfingerprint-pay-all-*.zip

      - name: Set release metadata
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)".*/\1/p' app/build.gradle)
          test -n "$VERSION"
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "tag=$VERSION-ci" >> "$GITHUB_OUTPUT"
            echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$VERSION-ci-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=$VERSION CI #$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.ref_name != github.event.repository.default_branch }}
          prerelease: false
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.name }}
          tag_name: ${{ steps.release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            module/build/release/zygisk-module-xfingerprint-pay-all-*.zip
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            SHA256SUMS
          body: |
            Fork build of [eritpchy/FingerprintPay](https://github.com/eritpchy/FingerprintPay) at `${{ github.sha }}`.

            ### 包含的修复

            - **Xposed 生命周期**：回填上游 7.0.2（`26a792c`）。旧代码把 hook 挂在 `Activity.onResume()` 这个可被子类覆写的方法上，宿主没走基类实现、或模块注入时 Activity 已经 resume 完毕，`onActivityResumed()` 就永远不会被调用。现改为 hook `performResume / performPause / performStop / performDestroy`（框架方法，不可覆写），并在安装后补发一次当前 Activity 的 resume 事件。对应「微信里已录入密码、付款时却不触发指纹」。
            - 微信 / QQ / 云闪付三个插件统一改走 `XposedAppLifecycle`，行为与支付宝、淘宝对齐。

            ### 安装

            - **APK**（`xposed.*.apk`）— LSPosed / Vector 模块，启用并勾选作用域后重启。
            - **模块 ZIP**（`zygisk-module-xfingerprint-pay-all-*.zip`）— Magisk / KernelSU / APatch 刷入，重启后在模块 WebUI 配置作用域并重新录入支付密码。
            - **两者只能二选一**。同时启用时由 `PluginApp.setup()` 的单例互斥决定谁生效（Zygisk 先注入，LSPosed 侧会静默 return），表现为「勾了但没反应」。
            - 本 APK 由 CI 自动生成临时签名，若之前装过官方版请先卸载。

            校验和见 `SHA256SUMS`。
